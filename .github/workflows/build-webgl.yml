name: Build Unity 2021 WebGL

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build WebGL (Unity 2021.3 LTS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-2021-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-2021-

      - name: Build WebGL via GameCI
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_TOTP_KEY: ${{ secrets.UNITY_TOTP_KEY }}
        with:
          targetPlatform: WebGL
          unityVersion: 2021.3.15f1
          buildMethod: BuildScript.BuildWebGL
          allowDirtyBuild: true

      - name: Inspect Build Output
        run: |
          ls -la build/WebGL
          ls -la build/WebGL/Build || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebGL-Build
          path: build/WebGL
